spring.application.name=s5-settlement-gateway
server.address=0.0.0.0
server.port=${SERVER_PORT:8085}

# Database Connection (PostgreSQL via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/s5_settlement_db}
spring.datasource.username=${DB_USERNAME:labbank_s5}
spring.datasource.password=${DB_PASSWORD:secret_s5_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

# JPA & Flyway Migration
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Execution report: Every day at 12:00 midnight Tehran time
settlement.report.cron=0 0 0 * * *

# Kafka topic for sending daily reports to the S6 service
settlement.kafka.topics.daily-report=s6-daily-settlement-reports